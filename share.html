  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --primary: #2D4B3E;
      --primary-hover: #1F362C;
      --accent: #B8834F;
      --text: #272B28;
      --text-muted: #736F68;
      --border: #E5E0D8;

      --radius: 12px;

    * {

      box-sizing: border-box;

    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem;

      flex-direction: column;
      align-items: center;

    .container {

    .header-box {

    .header-badge {

      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem;

      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      border: 1px solid #D4E3D9;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(45, 40, 30, 0.04);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .post-card:hover {
      border-color: #CFC9BE;
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #F1EFEA;
    }

    .template-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .template-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #F7F5F0;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .textarea-box {
      width: 100%;
      min-height: 160px;
      padding: 1rem;
      background: #FAF9F6;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text);
      resize: vertical;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .textarea-box:focus {
      background: #FFFFFF;
      border-color: var(--primary);
    }

    .actions-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-copy {
      background: #F1EFEA;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-copy:hover {
      background: #EAE6DF;
    }

    .btn-threads {
      background: var(--threads-black);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .btn-threads:hover {
      background: #262626;
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .back-link {
      margin-top: 1.5rem;
      text-align: center;
    }
    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <script src="./data.js"></script>
  <script>
    let allEvents = window.INITIAL_EVENTS || [];

    // 計算剩餘天數 (基準以今日 2026/11/23 為準)
    function getRemainingDays(deadlineStr) {
      if (!deadlineStr) return null;
      try {
        const parts = deadlineStr.split('/');
        if (parts.length === 3) {
          const target = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
          const now = new Date(2026, 10, 23); // 2026-11-23
          const diffTime = target - now;
          return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    function isExpired(deadlineStr) {
      const days = getRemainingDays(deadlineStr);
      return days !== null && days < 0;
    }

    // 每日自動生成最新文案邏輯
    function regenerateDailyPosts() {
      // 排除已截止的活動
      const activeEvents = allEvents.filter(e => !isExpired(e.deadline));

      // 1. 取得即將截止的 TOP 3
      const urgentEvents = [...activeEvents].sort((a, b) => {
        const daysA = getRemainingDays(a.deadline) ?? 999;
        const daysB = getRemainingDays(b.deadline) ?? 999;
        return daysA - daysB;
      }).slice(0, 3);

      // 2. 取得免消費即抽的 TOP 3
      const freeEvents = activeEvents.filter(e => e.tags.includes('免消費即抽')).slice(0, 3);

      // 3. 取得抽 iPhone / 家電的 TOP 3
      const gadgetEvents = activeEvents.filter(e => e.tags.includes('抽iPhone') || e.tags.includes('抽家電')).slice(0, 4);

      // 4. 取得當前日期
      const now = new Date(2026, 10, 23);
      const todayStr = `${now.getMonth() + 1}月${now.getDate()}日`;
      const dateBadge = document.getElementById('todayBadge');
      if (dateBadge) {
        dateBadge.innerHTML = `<i class="fa-brands fa-threads"></i> 今日 ${todayStr} 專屬文案已自動更新`;
      }

      // 生成範本 1：超商族發票共鳴款
      let urgentListText = '';
      urgentEvents.forEach((e, idx) => {
        const days = getRemainingDays(e.deadline);
        const dayStr = days !== null ? `（倒數剩 ${days} 天截止）` : '';
        urgentListText += `${idx + 1}. 【${e.brand}】${e.title}${dayStr}\n`;
      });

      document.getElementById('text-1').value = `大家在超商買完東西，發票千萬不要順手丟掉……\n\n【${todayStr} 最新快報】今天盤點全台灣目前快截止的超商與品牌抽獎，很多人都不知道現在能登錄：\n\n${urgentListText.trim()}\n\n越快截止的我直接排在最上面了，還有分出「完全不用花錢就能抽」的專區！\n\n查自己手邊發票能不能抽 👉 https://sheldonchuang.github.io/lucky-draw-tw/`;

      // 生成範本 2：免消費好康款
      let freeListText = '';
      freeEvents.forEach(e => {
        freeListText += `• 【${e.brand}】${e.title}（大獎：${e.prizes[0] || '官方大獎'}）\n`;
      });

      document.getElementById('text-2').value = `討厭登錄發票但想抽大獎的看這篇 ✈️\n\n【${todayStr} 最新整理】目前全台 ${activeEvents.filter(e => e.tags.includes('免消費即抽')).length} 檔【完全免消費、免買東西】就能參加的官方抽獎：\n\n${freeListText.trim()}\n\n已經把過期的通通濾掉了，只留現在能抽的，直接點進去就是原廠官方登錄頁：\n👉 https://sheldonchuang.github.io/lucky-draw-tw/\n\n（建議先存到手機主畫面，每天上去看一下有沒有新大獎）`;

      // 生成範本 3：iPhone & 家電大獎倒數款
      let gadgetListText = '';
      gadgetEvents.forEach(e => {
        const days = getRemainingDays(e.deadline);
        const dayStr = days !== null ? `（剩 ${days} 天）` : '';
        gadgetListText += `- 【${e.brand}】${e.title} ${dayStr}\n`;
      });

      document.getElementById('text-3').value = `想換 iPhone 或抽家電的注意了 📱\n\n【${todayStr} 抽獎盤點】全台目前有 ${activeEvents.filter(e => e.tags.includes('抽iPhone')).length} 檔抽 iPhone、${activeEvents.filter(e => e.tags.includes('抽家電')).length} 檔抽家電的大獎活動：\n\n${gadgetListText.trim()}\n\n越快截止的排在越前面，過期的都直接拿掉了：\n👉 https://sheldonchuang.github.io/lucky-draw-tw/`;

      // 生成範本 4：生活誌工具分享款
      document.getElementById('text-4').value = `之前覺得各大品牌的抽獎網頁分散在四處超難找，常常看到時都已經過期…\n\n乾脆自己做了一個台灣抽獎情報小站，介面做成日系生活誌的樣子，每頁排 9 個乾淨俐落，每天早上 8 點會自動爬最新官方活動。\n\n包含抽機票、抽 iPhone、抽家電都有分類，歡迎常抽獎的朋友拿去用，完全免費無廣告干擾：\n🔗 https://sheldonchuang.github.io/lucky-draw-tw/`;
    }

    // 直通 Threads 發文 (使用 Threads 官方 Web Intent)
    function postToThreads(textareaId) {
      const text = document.getElementById(textareaId).value;
      const url = `https://www.threads.net/intent/post?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // 複製全文到剪貼簿
    function copyText(textareaId) {
      const textarea = document.getElementById(textareaId);
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast();
      }).catch(err => {
        document.execCommand('copy');
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 頁面載入時自動執行生成今日專屬文案
    window.addEventListener('DOMContentLoaded', () => {
      regenerateDailyPosts();
    });
  </script>
