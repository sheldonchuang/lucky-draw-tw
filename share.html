<html lang="zh-TW">

  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --primary: #2D4B3E;
      --primary-hover: #1F362C;
      --accent: #B8834F;
      --text: #272B28;
      --text-muted: #736F68;
      --border: #E5E0D8;
      --threads-black: #000000;

      --font-serif: 'Noto Serif TC', serif;

    }

    * {

      padding: 0;

      font-family: var(--font-sans);
    }

    body {

      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .header-box {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem;
      background: #EBF1ED;
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      border: 1px solid #D4E3D9;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(45, 40, 30, 0.04);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .post-card:hover {
      border-color: #CFC9BE;
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #F1EFEA;
    }

    .template-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .template-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #F7F5F0;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .textarea-box {
      width: 100%;
      min-height: 160px;
      padding: 1rem;
      background: #FAF9F6;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text);
      resize: vertical;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .textarea-box:focus {
      background: #FFFFFF;
      border-color: var(--primary);
    }

    .actions-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-copy {
      background: #F1EFEA;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-copy:hover {
      background: #EAE6DF;
    }

    .btn-threads {
      background: var(--threads-black);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .btn-threads:hover {
      background: #262626;
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .back-link {
      margin-top: 1.5rem;
      text-align: center;
    }
    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <div id="toast" class="toast">

  <script>
    // 直通 Threads 發文 (使用 Threads 官方 Web Intent)
    function postToThreads(textareaId) {
      const text = document.getElementById(textareaId).value;
      const url = `https://www.threads.net/intent/post?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // 複製全文到剪貼簿
    function copyText(textareaId) {
      const textarea = document.getElementById(textareaId);
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast();
      }).catch(err => {
        // Fallback
        document.execCommand('copy');
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
