name: Daily Lottery Events Update

on:
  schedule:
    # 每天台灣時間 00:00 (UTC 16:00) 換日第一時間準時在雲端自動執行
    - cron: '0 16 * * *'
    # 每天台灣時間 08:00 (UTC 00:00) 早上補充更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 標籤頁隨時手動一鍵觸發更新

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crawler & Dynamic Update
        run: |
          python scripts/crawler.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.json data.js index.html share.html
          if git diff --staged --quiet; then
            echo "今日資料無變更，略過提交。"
          else
            git commit -m "chore(auto): 雲端定時全自動更新情報與活動資料 [skip ci]"
            git push origin main
          fi
